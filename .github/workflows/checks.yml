# On every push and pull request: install exactly the locked libraries, check for known security holes,
# check the code for errors and build the site. A red cross on GitHub means something here failed.
name: Checks
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Known security holes in libraries (high or critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: No secrets in the code
        run: |
          if git grep -nE "(service_role|SERVICE_ROLE_KEY|FLW_SECRET|GMAIL_APP_PASSWORD)\s*[:=]\s*['\"][A-Za-z0-9._-]{16,}" -- . ':!*.md'; then
            echo "A secret seems to be written in the code. Move it to the Supabase dashboard."; exit 1; fi
