    <style>
      /* Splash screen: shown from the first byte until the app is ready, in the person's own light or dark colours. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
        background: #F2F4FA; color: #1A1C29; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity .35s ease, visibility .35s ease }
      [data-splash="dark"] #splash { background: #12141C; color: #F2F3F8 }
      #splash.out { opacity: 0; visibility: hidden; pointer-events: none }
      .sp-mark { width: 72px; height: 72px; animation: sp-in .5s cubic-bezier(.2, .8, .2, 1) both, sp-breathe 2.4s ease-in-out .5s infinite }
      .sp-mark svg { width: 100%; height: 100%; display: block; fill: #4F5BEA; overflow: visible }
      .sp-lens { transform-box: view-box; transform-origin: 501.68px 450.55px; animation: sp-search 2.4s ease-in-out .5s infinite }
      .sp-word { margin-top: 16px; font-size: 24px; line-height: 32px; font-weight: 800; letter-spacing: -.02em; animation: sp-up .5s cubic-bezier(.2, .8, .2, 1) .12s both }
      .sp-bar { position: relative; width: 120px; height: 4px; margin-top: 24px; border-radius: 99px; overflow: hidden; background: #E3E6EF; animation: sp-up .5s cubic-bezier(.2, .8, .2, 1) .2s both }
      [data-splash="dark"] .sp-bar { background: #2A2E3D }
      .sp-bar span { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 99px; background: #4F5BEA; animation: sp-slide 1.2s cubic-bezier(.65, 0, .35, 1) infinite }
      [data-splash="dark"] .sp-bar span { background: #8C94FF }
      .sp-note { margin-top: 16px; font-size: 14px; line-height: 20px; color: #676C82; animation: sp-up .5s cubic-bezier(.2, .8, .2, 1) .28s both }
      [data-splash="dark"] .sp-note { color: #9298AE }
      @keyframes sp-in { from { opacity: 0; transform: scale(.85) } to { opacity: 1; transform: scale(1) } }
      @keyframes sp-up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes sp-breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.04) } }
      /* The lens moves in a small loop, like someone searching a map. */
      @keyframes sp-search { 0%, 100% { transform: translate(0, 0) } 25% { transform: translate(28px, -20px) } 50% { transform: translate(0, -36px) } 75% { transform: translate(-28px, -20px) } }
      @keyframes sp-slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
      @media (prefers-reduced-motion: reduce) {
        .sp-mark, .sp-lens, .sp-word, .sp-bar, .sp-note, .sp-bar span { animation: none }
        .sp-bar span { width: 100%; opacity: .5 }
      }
    </style>
